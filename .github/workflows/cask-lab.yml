name: cask-lab

# Throwaway. Renders the cask for an existing release with the current
# gh-actions renderer, and runs the release workflow's cask checks on it, so a
# change to the cask can be tried in two minutes instead of a full release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to render.
        default: v0.0.2

permissions: {}

jobs:
  lab:
    name: lab on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baskingspot/gh-actions
          path: gh-actions
          persist-credentials: false
      - name: Render
        run: |
          gh release download "${TAG}" --repo "${REPO}" --pattern SHA256SUMS --dir dist
          python3 gh-actions/scripts/render_cask.py --repo zigdoc-poc --tag "${TAG}" --sums dist/SHA256SUMS \
            --description "Proof of concept for baskingspot's release pipeline, on a copy of zigdoc" \
            --homepage "https://github.com/baskingspot/zigdoc-poc" --release-yaml .github/release.yaml --out cask/zigdoc-poc.rb
          cat cask/zigdoc-poc.rb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
      - name: Find Homebrew
        run: |
          if [ -d /home/linuxbrew/.linuxbrew/bin ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "${GITHUB_PATH}"
          fi
      - name: Put the cask in a local tap
        run: |
          brew tap-new --no-git baskingspot/check
          mkdir -p "$(brew --repository baskingspot/check)/Casks"
          cp cask/*.rb "$(brew --repository baskingspot/check)/Casks/"
      - name: Style
        run: brew style baskingspot/check
      - name: Audit (informational)
        continue-on-error: true
        run: brew audit --cask baskingspot/check/zigdoc-poc
      - name: Install and run
        run: |
          brew install --cask baskingspot/check/zigdoc-poc
          path="$(brew --prefix)/bin/zigdoc"
          test -x "${path}"
          "${path}" --help > /dev/null
          if [ "$(uname)" = Darwin ]; then
            if xattr -p com.apple.quarantine "${path}" 2> /dev/null; then
              echo "${path} is still quarantined" >&2
              exit 1
            fi
            echo "quarantine flag: gone"
          fi
      - name: Control, macOS only. Without the step, is the flag there?
        if: runner.os == 'macOS'
        run: |
          brew uninstall --cask baskingspot/check/zigdoc-poc
          # The same cask with the postflight_steps block deleted.
          awk '/^  # The release binaries/ {skip=1} skip && /^  end$/ {skip=0; next} !skip' cask/zigdoc-poc.rb > control.rb
          grep -c postflight_steps control.rb || true
          cp control.rb "$(brew --repository baskingspot/check)/Casks/zigdoc-poc.rb"
          brew install --cask baskingspot/check/zigdoc-poc
          path="$(brew --prefix)/bin/zigdoc"
          if xattr -p com.apple.quarantine "${path}" 2> /dev/null; then
            echo "control: the quarantine flag IS set without the step"
          else
            echo "control: the quarantine flag is NOT set even without the step"
          fi
