name: release

# A v* tag releases. The steps are the shared release workflow's: CI, the
# targets in .github/release.yaml, checksums and an attestation, the GitHub
# release, then a Homebrew cask in baskingspot/homebrew-tap. Make a tag with
# `just release VERSION`.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: baskingspot/gh-actions/.github/workflows/release.yml@79e6fa0dd9aea0cb438ff7dcb74c987885ecfe77 # v0.7.0
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
