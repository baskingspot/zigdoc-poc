name: release

# A v* tag releases. It runs the repo's CI, builds every target in
# .github/release.yaml on one Linux runner (Zig cross-compiles), writes
# SHA256SUMS, attests the tarballs, and creates the release with notes from the
# commits since the previous tag. Make a tag with `just release VERSION`.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      binary: ${{ steps.plan.outputs.binary }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release.yaml
          sparse-checkout-cone-mode: false
      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          config=$(yq -o=json '.' .github/release.yaml)
          binary=$(jq -er '.binary | select(type == "string")' <<< "${config}")
          matrix=$(jq -c '
            (.targets // error("release.yaml needs a targets list")) as $targets
            | if ($targets | type) != "array" or ($targets | length) == 0 then error("targets must be a non-empty list") else . end
            | ([$targets[] | keys[]] | unique - ["target", "asset", "blocking"]) as $extra
            | if ($extra | length) > 0 then error("unknown target keys: " + ($extra | join(", "))) else . end
            | [ $targets[]
                | (if (.target | type) != "string" or (.asset | type) != "string" then error("every target needs a target and an asset") else . end)
                | (if has("blocking") and ((.blocking | type) != "boolean") then error("blocking must be true or false") else . end)
                | { target: .target, asset: .asset, blocking: (if has("blocking") then .blocking else true end) } ]
          ' <<< "${config}")
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          jq -r '.[] | "\(.target) as \(.asset)" + (if .blocking then "" else " (non-blocking)" end)' <<< "${matrix}"

  ci:
    needs: plan
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/ci.yml@493673603fc4fb664187e0be455b580d9e7ea5dc # v0.6.0
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build:
    needs: [plan, ci]
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-26.04
    continue-on-error: ${{ !matrix.blocking }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.3/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: baskingspot
          extraPullNames: mattrobenolt
          skipPush: true
      - name: Build and package
        run: nix develop --command just release-build "$TARGET" "$ASSET" "$TAG"
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # the attestation is signed with the workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes read the tags and the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes
        run: scripts/release-notes.sh "${TAG}" | tee notes.md
        env:
          TAG: ${{ github.ref_name }}
      - name: Create the release
        run: gh release create "${TAG}" dist/* --repo "${REPO}" --title "${TAG}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
